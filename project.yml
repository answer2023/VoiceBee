name: VoiceJar
options:
  bundleIdPrefix: com.clearsky
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.1"
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"

targets:
  VoiceJar:
    type: application
    platform: macOS
    sources:
      - VoiceJar
    dependencies:
      - package: Sparkle
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearsky.VoiceJar
        PRODUCT_NAME: VoiceBee
        INFOPLIST_FILE: VoiceJar/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceJar/VoiceJar.entitlements
        ENABLE_HARDENED_RUNTIME: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
